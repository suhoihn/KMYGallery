
# The name displayed in GitHub's Actions tab
name: Deploy KMYGallery

# When should GitHub run this workflow?
on:
  push:
    branches: [main]       # Every push to main
  workflow_dispatch:       # Allow manual runs

# Minimum GitHub repository permissions
permissions:
  contents: read

# Avoid concurrent deployments to the same server
concurrency:
  group: kmygallery-production
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub creates a temporary Linux VM for this job
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository onto the runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install Node.js on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # 3. Build React/Vite into static dist/ files
      - name: Build React
        run: |
          npm ci
          npm run build

      # 4. Configure the SSH connection to your VPS
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 5. Transfer the built website to the VPS
      - name: Deploy website
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ ubuntu@142.249.56.175:/home/ubuntu/personal-site/public/

